name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The oldest Python the runner supports; runner images no longer ship 3.8, uv installs it.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.8'
          activate-environment: true
          enable-cache: false
      - run: python3 --version
      - run: python3 assets/harness.py check
